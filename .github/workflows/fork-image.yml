name: Fork image

# Pushing a tag fork-vX.Y.Z-ondemand.N runs the checks and publishes
# ghcr.io/<owner>/jellyball:X.Y.Z-ondemand.N (linux/amd64). Upstream's
# release.yml is left alone so upstream merges stay clean.

on:
  push:
    tags:
      - "fork-v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: Jellyball/requirements.txt

      - name: Install dependencies
        run: pip install -r Jellyball/requirements.txt ruff==0.16.9 mypy==2.4.0

      - name: Run unit tests
        working-directory: Jellyball
        run: python -m unittest discover -p "test_*.py"

      - name: Lint (ruff)
        run: ruff check Jellyball

      - name: Type-check
        run: mypy --config-file pyproject.toml

  image:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Image name and tag
        id: name
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner}/jellyball" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_REF_NAME#fork-v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/fork-v')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./Jellyball
          file: ./Jellyball/Dockerfile
          platforms: linux/amd64
          push: ${{ startsWith(github.ref, 'refs/tags/fork-v') }}
          tags: ${{ steps.name.outputs.image }}:${{ steps.name.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
